<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Iron Under Heaven</title>
<meta name="description" content="A forging story of the Warring States. Mend weapons for the war, earn your leave, and protect your family.">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Cormorant+Garamond:wght@600;700&family=Spectral:ital,wght@0,400;0,600;1,400&family=Alegreya+Sans:wght@500;700;800&display=swap">
<style>
/* Layout: black lacquer forge. Left column the patron's seal and your family, centre the anvil, right the weapon rack and quota ledger. Story scenes open as rice-paper scrolls over the forge. Stacks to one column on phones. */
:root {
  --lacquer: #120e0c;
  --panel: #1f1814;
  --panel-2: #2a211b;
  --line: #45362b;
  --ash: #a2917f;
  --rice: #efe4cc;
  --ink: #2a1d14;
  --vermilion: #c8372a;
  --ember: #ff7b22;
  --ember-dim: #a5471a;
  --bronze: #c99a4a;
  --jade: #6fbf8e;
  --plum: #b9a2e6;
  --f-display: "Cormorant Garamond", "Palatino Linotype", Georgia, serif;
  --f-han: "Ma Shan Zheng", "KaiTi", "STKaiti", "Kaiti SC", serif;
  --f-body: "Spectral", Georgia, "Times New Roman", serif;
  --f-ui: "Alegreya Sans", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: radial-gradient(110% 70% at 50% 115%, #3d150a 0%, var(--lacquer) 62%) fixed, var(--lacquer);
  color: var(--rice); font-family: var(--f-body); font-size: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 24px;
  -webkit-tap-highlight-color: transparent;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--bronze); outline-offset: 2px; }

.app { max-width: 1240px; margin: 0 auto; display: grid; gap: 14px; grid-template-columns: 250px minmax(0, 1fr) 290px; grid-template-areas: "head head head" "left stage side"; }
header { grid-area: head; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand .han { font-family: var(--f-han); font-size: 34px; line-height: 1; color: var(--rice); background: var(--vermilion); border-radius: 4px; padding: 4px 6px 2px; box-shadow: inset 0 0 0 2px rgba(255,255,255,.15); }
h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(26px, 3.6vw, 38px); margin: 0; line-height: 1; letter-spacing: .02em; text-wrap: balance; }
h1 small { display: block; font-family: var(--f-ui); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--ash); font-weight: 700; margin-top: 4px; }
.hud { display: flex; flex-wrap: wrap; gap: 8px; font-family: var(--f-ui); }
.chip { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; display: flex; flex-direction: column; min-width: 74px; }
.chip small { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ash); }
.chip b { font-size: 17px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip.warn b { color: var(--vermilion); }
.iconbtn { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; cursor: pointer; font-family: var(--f-ui); font-size: 13px; color: var(--ash); }

.left { grid-area: left; display: flex; flex-direction: column; gap: 12px; }
.patron { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: grid; grid-template-columns: 64px 1fr; gap: 10px 12px; align-items: center; }
.seal { width: 64px; height: 64px; display: grid; place-items: center; font-family: var(--f-han); font-size: 44px; line-height: 1; color: var(--rice); background: var(--vermilion); border-radius: 6px; box-shadow: inset 0 0 0 3px rgba(255,255,255,.12), inset 0 0 0 6px var(--vermilion), inset 0 0 0 7px rgba(255,255,255,.25); transform: rotate(-3deg); transition: transform .3s; }
.seal.bump { transform: rotate(4deg) scale(1.08); }
.patron .who b { font-family: var(--f-display); font-size: 22px; display: block; line-height: 1.05; }
.patron .who span { font-family: var(--f-ui); font-size: 12px; color: var(--ash); letter-spacing: .04em; }
.patron .say { grid-column: 1 / -1; font-style: italic; line-height: 1.45; min-height: 66px; color: #e8dcc4; }
.box h3, .side h3 { font-family: var(--f-ui); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--ash); margin: 0 0 6px; font-weight: 700; }
.family { display: flex; flex-direction: column; gap: 6px; }
.member { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; font-family: var(--f-ui); font-size: 13px; line-height: 1.3; }
.member b { font-size: 15px; color: var(--rice); }
.member .stars { color: var(--bronze); letter-spacing: 1px; margin-left: 4px; }
.member .status { display: block; color: var(--ash); }
.member.bad { border-color: #6a2a20; } .member.bad .status { color: #ff9a80; }
.member.good .status { color: var(--jade); }
.relic-list { display: flex; flex-direction: column; gap: 6px; }
.relic { font-family: var(--f-ui); font-size: 13px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; line-height: 1.3; }
.relic b { color: var(--bronze); display: block; font-size: 14px; }
.relic.used { opacity: .5; }
.muted { color: var(--ash); font-size: 14px; font-family: var(--f-ui); }

.stage { grid-area: stage; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.canvas-wrap { position: relative; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #0d0a08; }
canvas#forge { display: block; width: 100%; touch-action: manipulation; }
.swordname { position: absolute; left: 12px; top: 10px; right: 12px; display: flex; justify-content: space-between; gap: 8px; pointer-events: none; font-family: var(--f-ui); }
.swordname b { font-family: var(--f-display); font-weight: 700; font-size: 23px; text-shadow: 0 2px 6px #000; line-height: 1.1; }
.swordname span { font-size: 13px; color: var(--bronze); font-variant-numeric: tabular-nums; text-shadow: 0 2px 6px #000; text-align: right; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.panel .title { font-family: var(--f-display); font-weight: 700; font-size: 26px; line-height: 1; }
.panel p { margin: 0; line-height: 1.5; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn { cursor: pointer; border: 1px solid var(--ember-dim); background: linear-gradient(#ff8f3a, #d4581a); color: #1a0d05; font-family: var(--f-ui); font-weight: 800; font-size: 17px; border-radius: 6px; padding: 12px 20px; user-select: none; -webkit-user-select: none; touch-action: manipulation; box-shadow: 0 3px 0 #6b2a0c; }
.btn:active, .btn.held { transform: translateY(2px); box-shadow: 0 1px 0 #6b2a0c; }
.btn.big { font-size: 19px; padding: 15px 26px; flex: 1 1 200px; }
.btn.ghost { background: var(--panel-2); border-color: var(--line); color: var(--rice); box-shadow: 0 3px 0 #0c0907; font-weight: 700; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.kbd { font-family: var(--f-ui); font-size: 12px; color: var(--ash); }

.gauge { position: relative; height: 34px; border-radius: 5px; background: #120d0a; border: 1px solid var(--line); overflow: hidden; }
.gauge .zone { position: absolute; top: 0; bottom: 0; }
.gauge .fill { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, #5b1408, #d0401a, #ff9a3a, #fff0c0); }
.gauge .marker { position: absolute; top: -2px; bottom: -2px; width: 4px; margin-left: -2px; background: var(--rice); box-shadow: 0 0 8px #fff; border-radius: 2px; }
.gauge .lbl { position: absolute; top: 50%; transform: translateY(-50%); font-family: var(--f-ui); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.8); pointer-events: none; white-space: nowrap; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-family: var(--f-ui); font-size: 13px; color: var(--ash); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.odds { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; font-family: var(--f-ui); }
.odds div { background: #17110d; border: 1px solid var(--line); border-radius: 5px; padding: 5px 4px; text-align: center; }
.odds small { display: block; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ash); }
.odds b { font-size: 16px; font-variant-numeric: tabular-nums; }
.o-great b { color: var(--bronze); } .o-succ b { color: var(--jade); } .o-hold b { color: var(--ash); } .o-dmg b { color: #e08a5a; } .o-break b { color: var(--vermilion); }
.meters { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.meter small { font-family: var(--f-ui); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ash); display: flex; justify-content: space-between; gap: 6px; }
.bar { height: 10px; border-radius: 5px; background: #120d0a; border: 1px solid var(--line); overflow: hidden; margin-top: 3px; }
.bar > div { height: 100%; transition: width .12s; }
.bar.heat > div { background: linear-gradient(90deg, #7a1e0c, #ff7b22, #ffd27a); }
.bar.surge > div { background: linear-gradient(90deg, #8a1a10, #e0402a, #ffd0a0); }
.surging .bar.surge > div { animation: pulse .3s infinite alternate; }
@keyframes pulse { to { filter: brightness(1.6); } }

.side { grid-area: side; display: flex; flex-direction: column; gap: 12px; }
.rack { display: flex; flex-direction: column; gap: 8px; }
.slot { display: flex; flex-direction: column; min-width: 0; }
.card { cursor: pointer; text-align: left; width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; font-family: var(--f-ui); }
.slot .card:not(:only-child) { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
.card .nm { font-family: var(--f-body); font-weight: 600; font-size: 15px; line-height: 1.2; }
.card .gr { font-family: var(--f-display); font-weight: 700; font-size: 26px; line-height: 1; grid-row: span 2; align-self: center; color: var(--bronze); }
.card .st { font-size: 13px; color: var(--ash); }
.card.active { border-color: var(--ember); box-shadow: 0 0 0 1px var(--ember) inset; }
.card.broken .gr { color: var(--vermilion); font-family: var(--f-ui); font-size: 14px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; }
.card.done .st { color: var(--jade); }
.card.kept { border-color: #5a4a80; } .card.kept .st { color: var(--plum); }
.card:disabled { cursor: default; }
.keep { cursor: pointer; font-family: var(--f-ui); font-size: 13px; font-weight: 700; text-align: left; background: #17110d; border: 1px solid var(--line); border-top: none; border-radius: 0 0 8px 8px; padding: 6px 12px; color: var(--ash); }
.keep:hover:not(:disabled) { color: var(--rice); }
.keep.on { background: #2a2140; color: #d8c8ff; border-color: #5a4a80; }
.keep:disabled { opacity: .5; cursor: not-allowed; }
.tag { display: block; font-family: var(--f-ui); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--plum); font-weight: 700; }
.ledger { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; font-family: var(--f-ui); display: flex; flex-direction: column; gap: 6px; }
.ledger .big { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
.ledger .bar { height: 12px; }
.ledger .bar > div { background: linear-gradient(90deg, #8a6420, var(--bronze)); }
.ledger .bar.met > div { background: linear-gradient(90deg, #2f6a45, var(--jade)); }

/* story scrolls */
.overlay { position: fixed; inset: 0; background: rgba(8,5,3,.84); display: flex; align-items: flex-start; justify-content: center; z-index: 50; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); overflow-y: auto; backdrop-filter: blur(3px); }
.modal { max-width: 620px; width: 100%; margin: auto; display: flex; flex-direction: column; }
.scroll { background: linear-gradient(180deg, #f3ead6, #e9dcc0); color: var(--ink); border-radius: 4px; padding: 26px 26px 22px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 24px 70px #000; position: relative; }
.scroll::before, .scroll::after { content: ""; position: absolute; left: -10px; right: -10px; height: 14px; background: linear-gradient(180deg, #6b3a1e, #3a1d0c); border-radius: 7px; box-shadow: 0 2px 6px rgba(0,0,0,.5); }
.scroll::before { top: -7px; } .scroll::after { bottom: -7px; }
.scroll h2 { font-family: var(--f-display); font-weight: 700; font-size: 34px; margin: 0; line-height: 1.05; color: #8e1f15; text-wrap: balance; }
.scroll .eyebrow { font-family: var(--f-ui); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: #8a6a4a; font-weight: 700; }
.scroll .head { display: flex; gap: 14px; align-items: center; }
.scroll .head .seal { width: 52px; height: 52px; font-size: 34px; flex: none; }
.scroll p { margin: 0; line-height: 1.6; font-size: 16.5px; }
.scroll .note { background: rgba(142,31,21,.08); border-left: 3px solid #8e1f15; padding: 8px 12px; font-family: var(--f-ui); font-size: 14px; color: #5a2a1a; }
.scroll ul { margin: 0; padding-left: 20px; line-height: 1.55; }
.scroll .muted { color: #7a6450; }
.choices { display: flex; flex-direction: column; gap: 8px; }
.choice { cursor: pointer; text-align: left; background: #fbf5e6; border: 1px solid #c9b38c; border-radius: 6px; padding: 10px 14px; color: var(--ink); display: flex; flex-direction: column; gap: 2px; box-shadow: 0 2px 0 #c9b38c; }
.choice:hover:not(:disabled) { border-color: #8e1f15; box-shadow: 0 2px 0 #8e1f15; }
.choice b { font-family: var(--f-ui); font-size: 16px; font-weight: 800; }
.choice span { font-family: var(--f-ui); font-size: 14px; color: #6a5440; }
.choice .why { color: #9a2a1a; font-weight: 700; }
.choice:disabled { cursor: not-allowed; opacity: .6; box-shadow: none; }
.scroll .btn.ghost { background: #e8dcc0; color: var(--ink); border-color: #c9b38c; box-shadow: 0 3px 0 #b9a27c; }
.tally { font-family: var(--f-ui); display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-variant-numeric: tabular-nums; }
.tally .tot { border-top: 1px solid #c9b38c; padding-top: 6px; font-weight: 800; }
.shop { display: grid; gap: 8px; }
.ware { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; background: #fbf5e6; border: 1px solid #c9b38c; border-radius: 6px; padding: 10px 12px; }
.ware b { color: #8e1f15; font-family: var(--f-ui); }
.ware span { font-family: var(--f-ui); font-size: 14px; color: #6a5440; }
.ware .btn { grid-row: span 2; padding: 8px 14px; font-size: 15px; }
.form { display: grid; gap: 14px; font-family: var(--f-ui); }
.field { display: grid; gap: 6px; }
.field > label, .field > .lab { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; font-weight: 800; color: #8a6a4a; }
.field input[type=text] { background: #fbf5e6; border: 1px solid #c9b38c; border-radius: 6px; padding: 9px 11px; color: var(--ink); width: 100%; }
.fam-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: end; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button { cursor: pointer; background: #fbf5e6; border: 1px solid #c9b38c; border-radius: 5px; padding: 7px 10px; font-family: var(--f-ui); font-weight: 700; font-size: 14px; color: #5a4430; }
.seg button[aria-pressed="true"] { background: #8e1f15; border-color: #8e1f15; color: #fbf5e6; }
.hint { font-size: 13px; color: #6a5440; }
.trouble { font-weight: 800; }

@media (max-width: 1020px) {
  .app { grid-template-columns: minmax(0, 1fr) 270px; grid-template-areas: "head head" "stage side" "left side"; }
  .left { flex-direction: row; flex-wrap: wrap; } .left > * { flex: 1 1 220px; }
}
@media (max-width: 720px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-areas: "head" "stage" "side" "left"; }
  .rack { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .card { grid-template-columns: 1fr; padding: 8px; } .card .gr { grid-row: auto; font-size: 22px; } .card .nm { font-size: 13px; }
  .keep { padding: 6px 8px; font-size: 12px; }
  .odds b { font-size: 14px; }
  .scroll { padding: 22px 16px 18px; } .scroll h2 { font-size: 28px; }
  .fam-row { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.langpick select { appearance: none; -webkit-appearance: none; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 26px 6px 10px; color: var(--rice); font-family: var(--f-ui); font-size: 13px; cursor: pointer; height: 100%; background-image: linear-gradient(45deg, transparent 50%, var(--ash) 50%), linear-gradient(135deg, var(--ash) 50%, transparent 50%); background-position: right 12px center, right 7px center; background-size: 5px 5px; background-repeat: no-repeat; }
.howto { line-height: 1.45; }
.howto b { color: var(--rice); }
.langs { display: flex; flex-wrap: wrap; gap: 4px; }
.langs button { cursor: pointer; background: #fbf5e6; border: 1px solid #c9b38c; border-radius: 5px; padding: 6px 10px; font-family: var(--f-ui); font-weight: 700; font-size: 14px; color: #5a4430; }
.langs button[aria-pressed="true"] { background: #2a1d14; border-color: #2a1d14; color: #fbf5e6; }
:root[data-lang="zh-Hans"] { --f-display: "Noto Serif SC", "Songti SC", "SimSun", serif; --f-body: "Noto Serif SC", "Songti SC", "SimSun", serif; --f-ui: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif; }
:root[data-lang="zh-Hant"] { --f-display: "Noto Serif TC", "Songti TC", "PMingLiU", serif; --f-body: "Noto Serif TC", "Songti TC", "PMingLiU", serif; --f-ui: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif; }
:root[data-lang="ja"] { --f-display: "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif; --f-body: "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif; --f-ui: "Hiragino Sans", "Yu Gothic", "Meiryo", "Noto Sans JP", system-ui, sans-serif; }
:root[data-lang="zh-Hans"] .scroll p, :root[data-lang="zh-Hant"] .scroll p, :root[data-lang="ja"] .scroll p { line-height: 1.8; }
:root[data-lang="zh-Hans"] h1, :root[data-lang="zh-Hant"] h1, :root[data-lang="ja"] h1 { letter-spacing: .08em; }


html, body { overscroll-behavior: none; }
body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }

</style>

<body>
<div class="app" id="app">
  <header>
    <div class="brand"><span class="han" id="brandHan" aria-hidden="true">鐵</span><h1><span data-i18n="ui.title">Iron Under Heaven</span><small id="hStage"></small></h1></div>
    <div class="hud">
      <div class="chip"><small data-i18n="hud.tour">Tour · day</small><b id="hTour">1 / 3</b></div>
      <div class="chip"><small id="hQuotaLbl">Quota</small><b id="hQuota">0</b></div>
      <div class="chip"><small data-i18n="hud.silver">Silver</small><b id="hGold">0</b></div>
      <div class="chip"><small data-i18n="hud.merit">Merit</small><b id="hMerit">0</b></div>
      <div class="chip" id="hWarnChip"><small data-i18n="hud.fails">Failed days</small><b id="hWarn">0 / 3</b></div>
      <label class="langpick"><span class="sr" data-i18n="ui.language">Language</span><select id="langSel"></select></label>
      <button class="iconbtn" id="muteBtn" aria-pressed="false">Sound on</button>
    </div>
  </header>

  <aside class="left">
    <div class="patron">
      <div class="seal" id="seal" aria-hidden="true">鐵</div>
      <div class="who"><b id="pName"></b><span id="pRole"></span></div>
      <div class="say" id="speech" aria-live="polite">…</div>
    </div>
    <div class="box"><h3 data-i18n="ui.family">Your family</h3><div class="family" id="family"></div></div>
    <div class="box"><h3 data-i18n="ui.charms">Charms and tools</h3><div class="relic-list" id="relicList"></div></div>

      <p>They would have marched you north too, {N}, but the sergeant saw the burn scars on your forearms. "A smith," he said. "The front has enough corpses. The army needs blades." So you were kept back in a supply camp behind the lines, mending the weapons that come back from the fighting.</p>

      text: `<p>The clerk takes your silver and lets you kneel in the courtyard for half a day. Finally Magistrate Gao Shen appears, plump and smiling, with his son yawning behind him.</p><p>"Abduction? Such an ugly word. My son has invited your family as guests." He strokes his beard. "But I hear you are a fine smith. My household armory needs one. Serve me, and your family will be treated as honoured guests. Refuse, and you will have twenty strokes of bamboo for slandering an official."</p>`,

      c2: { _: "Refuse and take the beating", d: "Twenty strokes. You will forge with a bruised back next tour: 2 fewer strikes per weapon.", note: "Twenty strokes. You crawl home. Granny Wang cleans your back and doesn't say a word." } },
    night: { eb: "Midnight" },

      lockHard: "You go over the back wall while the household runs for buckets. Your {blade} takes three blows to break the women's-quarter lock.",

      notEnough: "A dog barks. Then ten. Your {blade} is not enough against a courtyard full of guards. They beat you until you stop moving.",
      text: 'When you wake, you are in chains in front of Magistrate Gao. "A smith who climbs walls," he muses. "Very well. You will forge for my household. Your family stays as my guests, so you behave."',

    general: { eb: "General Meng's camp" },
    genYes: { title: "The General rides",
      text: { _: `<p>General Meng knows your name. He has your ledger from Sergeant Zhao: the quotas met, the blades that held at the pass.</p><p>"A magistrate's son steals the family of my best smith while we bleed for the realm?" He sends twenty cavalry to Willow Bend that afternoon. Gao Ying is dragged into the square and flogged in front of the whole county, and {who} walks home free.</p><p>A week later a letter with the royal seal arrives: you are summoned to the Royal Arsenal in the capital.</p>`,
        pl: `<p>General Meng knows your name. He has your ledger from Sergeant Zhao: the quotas met, the blades that held at the pass.</p><p>"A magistrate's son steals the family of my best smith while we bleed for the realm?" He sends twenty cavalry to Willow Bend that afternoon. Gao Ying is dragged into the square and flogged in front of the whole county, and {who} walk home free.</p><p>A week later a letter with the royal seal arrives: you are summoned to the Royal Arsenal in the capital.</p>` },
      c1: "Go to the capital with your family" },
    genNo: { title: "The General refuses",

      c1: "Ride home", note: "The General would not help." },
    drum: { eb: "The capital", title: "The Grievance Drum",
      text: `<p>It takes four days to reach the capital. The great drum stands outside the palace gate, its skin dark with the hands of the desperate. You beat it until a censor comes out and writes down every word.</p><p>"The court will investigate," he says. "It may take some time. Go back to your duty, and pray."</p>`,

    drumWin: { title: "The censor's verdict",
      text: { _: "You come home to find the village in an uproar. The royal censor has been and gone. Magistrate Gao has been stripped of his post, and Gao Ying has fled. {who} is home, thin and pale, but home.",
        pl: "You come home to find the village in an uproar. The royal censor has been and gone. Magistrate Gao has been stripped of his post, and Gao Ying has fled. {who} are home, thin and pale, but home." },

    drumLose: { title: "No answer",

        pl: "No censor ever came. Granny Wang tells you the Gao family sent the court a cartload of gifts. {who} are still in the Gao manor." },
      c1: "Then you will act yourself", note: "The court will not help." },
    marsh: { eb: "The Reed Marsh · between raids", title: "News from the court",
      text: `<p>Your family has a hut on stilts now. {W} has learned to mend nets, and {B} can pole a boat better than you.</p><p>A boat arrives with news: the court is desperate for soldiers and offers amnesty to any outlaw who joins the war. And Iron Ox has a plan of his own. "The Gao manor is fat with stolen levies, brother. Arm us well, and we take it."</p>`,
      c1: { _: "Accept the court's amnesty", d: "Your crimes are forgiven and you return to the army camp. Your family goes home to Willow Bend." },
      c2: { _: "Stay with the outlaws", d: "Keep forging for the marsh. The brothers look after their own." },
      c3: { _: "Lead the raid on the Gao manor", d: "Forge a blade of +6 or better for Iron Ox. If it holds, the manor falls and the loot is shared." } },
    gao: { eb: "The Gao manor", title: "An hour with your family",
      text: `<p>Steward Qian lets you see {who} for one hour, in a courtyard with guards at every door. They are fed and dressed in silk, and they look like ghosts. Granny Wang has been bringing {B} to the manor gate so he can wave.</p><p>You have a few days before the next tour.</p>`,
      c1: { _: "Forge a treasure for Gao Ying and ask for their freedom", d: "Make a blade of +8 or better. Gao Ying might trade anything for a sword like that." },
      c2: { _: "Plan an escape with Granny Wang's help", d: "Granny Wang smuggles in a key, and you all run for the marsh. The more she trusts you, the better the odds." },
      c3: { _: "Endure. Keep forging and keep them safe", d: "Do as you are told. One day, perhaps, things will change." } },
    escWin: { title: "The kitchen door", text: 'Granny Wang arrives with a basket of turnips and a key baked into a bun. At the third watch you lead {who} out through the kitchen door, collect {B} and walk all night to the Reed Marsh. Iron Ox has heard of the smith who escaped the Gao manor. "Can you forge?" he asks.' },
    escLose: { title: "Betrayed by a dog", text: "The key works. The dog does not care. Guards drag you back to the armory, and Steward Qian has you beaten. Your family is moved to the inner quarters, where you cannot see them.", c1: "Back to the anvil" },
    royal: { eb: "The capital", title: "A courtyard of your own",
      text: `<p>The Arsenal gives you a small courtyard house near the East Market. {W} has planted chrysanthemums. {D} has more suitors than you can count, and none of them dare misbehave with a royal smith's daughter.</p><p>Minister Gong has news: when the war ends, the King wants a sword to mark the victory. He wants it from you. You have a few days of rest first.</p>`,
      c1: { _: "Spend the days with your family", d: "The furnace spirit starts half full next tour." },
      c2: { _: "Take {B} to the Arsenal as your apprentice", d: "He rebuilds your bellows like a little master: the furnace's good band is wider from now on." },

    ransom: { title: "A fair trade",
      text: `<p>Gao Ying draws the blade and the whole hall goes quiet. He swings it, laughs like a child, and agrees to anything. {who} walk out of the Gao manor beside you.</p><p>Your contract is bought out by the army, and you return to the supply camp a free man with a family waiting at home.</p>`,

  n: {
    prologue: { eb: "梁惠王三十一年", title: "铁之年",
      text: `<p>七国交战，梁国节节败退。今年春天，征兵的人来到柳湾村，带走了每个拿得动长枪的男人：农夫、渔夫，连桥边卖饺子的少年也没放过。</p>
      <p>他们本来也要押你北上，{N}，但那伍长看见了你小臂上的烫伤疤。「是个铁匠，」他说，「前线的尸体够多了。军队需要刀剑。」于是你被留在前线后方的后勤营，修补从战场上送回来的兵器。</p>
      <p>{W}、{D}和小{B}在村口目送你离开。服役 <b>{days} 天</b>，定额失败不到 {fails} 次，军队就会准你回家休假。</p>
      <p class="note">每天你会拿到三件破损的兵器。在铁砧上提高它们的品级，喜欢的话把最好的存进铁箱，上交足够的兵器完成定额。你在家里的选择将决定故事的走向。</p>`,
      c1: "向赵伍长报到" },
    hub: { eb: "回家休假 · 第 {d}/3 天", title1: "柳树门", title: "柳湾村",
      arrive: "村子空了一半，田里干活的只有女人、老人和孩子。接着{B}看见路上的你，飞奔过来。",
      ask1: "第一天你要怎么过？", ask: "这一天你要怎么过？" },
    end: { eb: "回家休假 · 最后一个早晨", title: "回到铁炉", text: "军车停在柳树门口。{W}往你的包袱里塞了年糕。{B}拽着你的袖子，直到车夫咂了咂舌头。</p><p>第 {tour}/{tours} 轮开始了。", c1: "坐车回营" },
    leave: { eb: "回家休假" },
    levy: { title: "军饷捐",
      text: `<p>巷子里传来马蹄声。县令的儿子高英带着四个家丁骑马而来。他二十岁，细皮嫩肉，身上的绸缎比全村加起来还多。</p><p>「军饷捐，」他的管家宣布，「每户六十文，保家卫国。」谁都知道这钱从来出不了高府。</p>`,
      c1: { _: "交捐", d: "宁可钱袋轻一点，也别让他注意到你。", note: "高英几乎没看你一眼。很好。" },
      c2: { _: "拒绝。你已经在为军队效力", d: "说得对，也很勇敢。他会记住你这张脸。", note: "高英的目光在你家停留了很久，才骑马离开。" } },
    mm: { title: "媒婆上门",
      text: `<p>刘媒婆坐着红轿子来了，手里捧着一个漆盒。「天大的福气！高少爷在集上看见了{D}，日思夜想。他要把她收进府里，做第七房小妾。」</p><p>她打开盒子：串好的铜钱，<b>300 文</b>。「彩礼！这可是打仗的年头！」</p>`,
      c1: { _: "收下彩礼", d: "{D}进高府。你得到 300 文和高家的好感。", note: "{D}坐在轿子里没有回头。{W}一整天没和你说话。" },
      c2: { _: "客气地拒绝", d: "鞠躬、奉承，然后说不。高家可不习惯听到「不」。", note: "刘媒婆笑着走了，这比她破口大骂更可怕。" },
      c3: { _: "把{D}许配给隔壁的阿水", d: "已订亲的姑娘，不闹出丑闻就纳不成妾。王婆婆的孙子喜欢她好多年了。", req: "需要王婆婆信任你，或者有 100 文置办像样的聘礼。", note: "亲事定得仓促，高家觉得受了侮辱，但{D}已经有了婆家。" },
      c4: { _: "改送高英一把好剑", d: "今晚打出 +5 或更高的剑。他那种公子哥，爱一把好剑胜过任何姑娘。" } },
    market: { title: "赶集日",
      text: `<p>你带全家去县里赶集。在鱼摊旁，高英从茶馆里走出来，一把抓住{T}的手腕。「来给我倒茶，」他笑道。家丁们也跟着笑。人群忽然对白菜产生了浓厚的兴趣。</p>`,
      c1: { _: "低头赔罪", d: "轻轻把她拉开，为莫须有的事道歉。这次他会放手。", note: "高英放了手，但他问家丁你叫什么名字。" },
      c2: { _: "把他推进鱼盆里", d: "会非常痛快。然后你就得带着全家逃命。" },
      c3: { _: "亮出蒙将军给你的军牌", d: "功劳够大的铁匠，有将军的庇护。", req: "需要 {merit} 点功劳。你有 {m} 点。超额完成定额可以挣更多。", note: "高英看见将军的印信，脸色发白，灰溜溜地溜回了茶馆。你的家人再也不会被骚扰了。" },
      c4: { _: "塞给他的管家一些银钱", d: "在高家，钱就是道理。", note: "管家对主子耳语几句，高英便没了兴趣。暂时而已。" } },
    flee: { title: "逃进芦苇荡",
      text: `<p>高英一头栽进鱼盆。那光荣的一刻，整个集市鸦雀无声。然后家丁们拔出了刀。</p><p>你拉起{W}、{D}和{B}就跑。王婆婆把你们藏在她的地窖里直到天黑，半夜一个不多问的船夫把你们送进芦苇荡深处，那里的好汉不受任何县令管辖。</p><p>码头上，一个满脸伤疤的大汉迎接你。「我听说你对高家小子干的好事了，」铁牛说，「你会打铁吗？」</p>` },
    abduct: { title: "夜半马蹄",
      text: "<p>回家的第二个晚上，高府的家丁撞开了你的门。你奋力反抗，一棍子打在头上，你倒在地上。醒来时，{who}不见了。{B}躲在隔壁王婆婆的床底下。</p>",
      c1: "爬起来" },
    empty: { title: "空荡荡的家", title2: "现在怎么办？",
      text: `<p>院门只挂在一个合页上。米缸被砸碎了。屋里一片寂静。</p><p>隔壁的王婆婆坐在你家门槛上，{B}在她怀里睡着了。「三天前来的，」她低声说，「高少爷的人。他们带走了{who}。孩子躲在米缸里，等他们走了才出来。我不忍心丢下孩子一个人，就一直照看着他。」</p>`,
      ask: "{who}被扣在高府。你要怎么做？",
      c1: { _: "好好答谢王婆婆", d: "给她些银钱，谢她操心。她很穷，还冒了风险。", note: "王婆婆抹着眼泪，说你是个好孩子。她说她会尽力帮你。" },
      c2: { _: "去县衙告状", d: "贿赂书吏，让县令审你的案子。县令是高英的父亲。" },
      c3: { _: "今晚闯进高府", d: "给自己打一把刀，翻墙进去，把她们抢回来。刀越好，胜算越大。王婆婆如果信任你，可以帮你声东击西。" },
      c4: { _: "骑马去蒙将军营中", d: "求将军帮忙。他只听有功劳的铁匠的话（需要 {merit}）。" },
      c5: { _: "进京敲登闻鼓", d: "任何百姓都可以在宫门外敲鼓，向大王申冤。公道来得慢，等待期间你得回去干活。" } },
    yamen: { eb: "县衙", title: "高县令",
      text: `<p>书吏收了你的银钱，让你在院子里跪了半天。终于，高绅县令出来了，白白胖胖，满脸堆笑，他儿子在身后打着哈欠。</p><p>「抢人？这话多难听。我儿子是请你的家人来做客。」他捋着胡子。「不过听说你是个好铁匠。我府上的兵器房正缺一个。替我效力，你的家人就是贵客。不肯的话，诬告朝廷命官，打你二十大板。」</p>`,
      c1: { _: "答应。替高府效力", d: "你将在高府兵器房打铁，离家人很近，却任凭高家摆布。" },
      c2: { _: "拒绝，挨板子", d: "二十大板。下一轮你带着背伤打铁：每件兵器少 2 次锻打。", note: "二十大板。你爬着回了家。王婆婆给你清理背上的伤，一句话也没说。" } },
    night: { eb: "半夜" },
    raidWin: { title: "翻墙而入",
      granny: "王婆婆放火烧了高府马厩的屋顶，然后哭喊得比谁都响。",
      lockEasy: "趁府里的人都跑去提水，你翻过后墙。你的{blade}像切纸一样斩断了内院的锁。",
      lockHard: "趁府里的人都跑去提水，你翻过后墙。你的{blade}砍了三下才劈开内院的锁。",
      text: "{who}正在等你。你背着{B}，一路跑到芦苇荡边上。天亮时，你的人头已经被悬赏，一个叫铁牛的好汉头领请你去打铁。" },
    raidLose: { title: "被抓",
      useless: "一只狗叫了起来，接着是十只。面对满院的家丁，你的{blade}毫无用处。他们把你打得动弹不得。",
      notEnough: "一只狗叫了起来，接着是十只。面对满院的家丁，你的{blade}不够用。他们把你打得动弹不得。",
      text: "醒来时，你戴着镣铐跪在高县令面前。「会翻墙的铁匠，」他若有所思，「也好。你就给我府上打铁吧。你的家人继续在这里做客，所以你给我老实点。」",
      c1: "在高府兵器房干活" },

  n: {
    prologue: { eb: "梁惠王三十一年", title: "鐵之年",
      text: `<p>七國交戰，梁國節節敗退。今年春天，徵兵的人來到柳灣村，帶走了每個拿得動長槍的男人：農夫、漁夫，連橋邊賣餃子的少年也沒放過。</p>
      <p>他們本來也要押你北上，{N}，但那伍長看見了你小臂上的燙傷疤。「是個鐵匠，」他說，「前線的屍體夠多了。軍隊需要刀劍。」於是你被留在前線後方的後勤營，修補從戰場上送回來的兵器。</p>
      <p>{W}、{D}和小{B}在村口目送你離開。服役 <b>{days} 天</b>，定額失敗不到 {fails} 次，軍隊就會準你回家休假。</p>

    leave: { eb: "回家休假" },
    levy: { title: "軍餉捐",
      text: `<p>巷子裡傳來馬蹄聲。縣令的兒子高英帶著四個家丁騎馬而來。他二十歲，細皮嫩肉，身上的綢緞比全村加起來還多。</p><p>「軍餉捐，」他的管家宣佈，「每戶六十文，保家衛國。」誰都知道這錢從來出不了高府。</p>`,
      c1: { _: "交捐", d: "寧可錢袋輕一點，也別讓他注意到你。", note: "高英幾乎沒看你一眼。很好。" },
      c2: { _: "拒絕。你已經在為軍隊效力", d: "說得對，也很勇敢。他會記住你這張臉。", note: "高英的目光在你家停留了很久，才騎馬離開。" } },
    mm: { title: "媒婆上門",
      text: `<p>劉媒婆坐著紅轎子來了，手裡捧著一個漆盒。「天大的福氣！高少爺在集上看見了{D}，日思夜想。他要把她收進府裡，做第七房小妾。」</p><p>她打開盒子：串好的銅錢，<b>300 文</b>。「彩禮！這可是打仗的年頭！」</p>`,
      c1: { _: "收下彩禮", d: "{D}進高府。你得到 300 文和高家的好感。", note: "{D}坐在轎子裡沒有回頭。{W}一整天沒和你說話。" },

      c3: { _: "把{D}許配給隔壁的阿水", d: "已訂親的姑娘，不鬧出醜聞就納不成妾。王婆婆的孫子喜歡她好多年了。", req: "需要王婆婆信任你，或者有 100 文置辦像樣的聘禮。", note: "親事定得倉促，高家覺得受了侮辱，但{D}已經有了婆家。" },

    market: { title: "趕集日",
      text: `<p>你帶全家去縣裡趕集。在魚攤旁，高英從茶館裡走出來，一把抓住{T}的手腕。「來給我倒茶，」他笑道。家丁們也跟著笑。人群忽然對白菜產生了濃厚的興趣。</p>`,

      c2: { _: "把他推進魚盆裡", d: "會非常痛快。然後你就得帶著全家逃命。" },
      c3: { _: "亮出蒙將軍給你的軍牌", d: "功勞夠大的鐵匠，有將軍的庇護。", req: "需要 {merit} 點功勞。你有 {m} 點。超額完成定額可以掙更多。", note: "高英看見將軍的印信，臉色發白，灰溜溜地溜回了茶館。你的家人再也不會被騷擾了。" },
      c4: { _: "塞給他的管家一些銀錢", d: "在高家，錢就是道理。", note: "管家對主子耳語幾句，高英便沒了興趣。暫時而已。" } },
    flee: { title: "逃進蘆葦蕩",
      text: `<p>高英一頭栽進魚盆。那光榮的一刻，整個集市鴉雀無聲。然後家丁們拔出了刀。</p><p>你拉起{W}、{D}和{B}就跑。王婆婆把你們藏在她的地窖裡直到天黑，半夜一個不多問的船夫把你們送進蘆葦蕩深處，那裡的好漢不受任何縣令管轄。</p><p>碼頭上，一個滿臉傷疤的大漢迎接你。「我聽說你對高家小子幹的好事了，」鐵牛說，「你會打鐵嗎？」</p>` },

      text: "<p>回家的第二個晚上，高府的家丁撞開了你的門。你奮力反抗，一棍子打在頭上，你倒在地上。醒來時，{who}不見了。{B}躲在隔壁王婆婆的床底下。</p>",
      c1: "爬起來" },
    empty: { title: "空蕩蕩的家", title2: "現在怎麼辦？",
      text: `<p>院門只掛在一個合頁上。米缸被砸碎了。屋裡一片寂靜。</p><p>隔壁的王婆婆坐在你家門檻上，{B}在她懷裡睡著了。「三天前來的，」她低聲說，「高少爺的人。他們帶走了{who}。孩子躲在米缸裡，等他們走了才出來。我不忍心丟下孩子一個人，就一直照看著他。」</p>`,
      ask: "{who}被扣在高府。你要怎麼做？",
      c1: { _: "好好答謝王婆婆", d: "給她些銀錢，謝她操心。她很窮，還冒了風險。", note: "王婆婆抹著眼淚，說你是個好孩子。她說她會盡力幫你。" },

      c3: { _: "{D}を隣の阿水と婚約させる", d: "婚約した娘を妾にすれば醜聞になる。王婆さんの孫は何年も前から彼女に夢中だ。", req: "王婆さんの信頼か、まともな結納の品のための 100 文が必要。", note: "婚約は慌ただしく、高家は面子をつぶされたが、{D}にはもう相手がいる。" },
      c4: { _: "代わりに高英へ見事な剣を贈る", d: "今夜 +5 以上の刃を打つ。ああいう若者は、どんな娘より美しい剣を好むものだ。" } },
    market: { title: "市の日",
      text: `<p>家族を連れて県の市へ出かけた。魚屋のそばで、高英が茶館から出てきて{T}の手首をつかんだ。「茶を注ぎに来い」と笑う。家来たちも一緒に笑う。人々は急に白菜に夢中になった。</p>`,
      c1: { _: "深く頭を下げて許しを請う", d: "そっと彼女を引き離し、何もしていないのに謝る。今回は放してくれるだろう。", note: "高英は手を放したが、家来にあなたの名前を尋ねていた。" },
      c2: { _: "魚の桶に突き落とす", d: "最高の気分だろう。そのあとは家族全員で逃げることになる。" },
      c3: { _: "蒙将軍の軍の札を見せる", d: "功績を積んだ鍛冶屋には将軍の庇護がある。", req: "功績 {merit} が必要。今は {m}。ノルマを余裕をもって達成すれば功績が増える。", note: "高英は将軍の印を見て青ざめ、こそこそ茶館に引っ込んだ。もう家族が煩わされることはない。" },
      c4: { _: "執事に銀を握らせる", d: "高家には金がものを言う。", note: "執事が主人に耳打ちすると、高英は興味を失った。今のところは。" } },
    flee: { title: "葦の中へ",
      text: `<p>高英は頭から魚の桶に突っ込んだ。輝かしい一瞬、市場じゅうが静まり返った。それから家来たちが剣を抜いた。</p><p>あなたは{W}と{D}と{B}をつかんで走った。王婆さんが暗くなるまで地下の穴蔵にかくまってくれ、真夜中、何も聞かない渡し守が葦の沼の奥へ運んでくれた。そこはどの県令の手も届かない、好漢たちの住む場所だ。</p><p>桟橋で、傷だらけの顔の大男が出迎えた。「高のせがれにしたこと、聞いたぜ」と鉄牛が言う。「鍛冶はできるか？」</p>` },
    abduct: { title: "夜の蹄の音",
      text: "<p>帰って二日目の夜、高家の家来たちが戸を破って押し入った。あなたは戦ったが、頭を棍棒で殴られて倒れた。目を覚ますと、{who}の姿はなかった。{B}は隣の王婆さんの寝台の下に隠れていた。</p>",
      c1: "立ち上がる" },
    empty: { title: "空っぽの家", title2: "どうする？",
      text: `<p>門は蝶番一つでぶら下がっている。米甕は割られている。家の中は静まり返っている。</p><p>隣の王婆さんが戸口に座り、膝の上で{B}が眠っている。「三日前に来たんだよ」と婆さんはささやいた。「高の若様の手下さ。{who}を連れていった。この子は連中が帰るまで米甕に隠れてた。一人にしておけなくてね、ずっと面倒を見てたんだ。」</p>`,
      ask: "{who}は高家の屋敷に囚われている。どうする？",
      c1: { _: "王婆さんにきちんとお礼をする", d: "苦労に銀で報いる。彼女は貧しく、危険を冒してくれた。", note: "王婆さんは涙を流し、あなたをいい子だと言った。できることは何でも手伝うと言う。" },
      c2: { _: "県の役所に訴え出る", d: "書記に賄賂を渡して県令に訴えを聞かせる。県令は高英の父親だ。" },
      c3: { _: "今夜、高家の屋敷に押し入る", d: "自分で刃を打ち、塀を越えて取り返す。刃が良いほど勝ち目がある。王婆さんが信頼してくれていれば、陽動をしてくれる。" },
      c4: { _: "蒙将軍の陣営へ馬を走らせる", d: "将軍に助けを乞う。将軍は功績のある鍛冶屋の言うことしか聞かない（{merit} 必要）。" },
      c5: { _: "都へ行き登聞鼓を打つ", d: "宮殿の外の鼓は、誰でも打って王に訴えることができる。裁きは遅く、待つ間は仕事に戻らねばならない。" } },
    yamen: { eb: "県の役所", title: "高県令",
      text: `<p>書記は銀を受け取り、中庭で半日ひざまずかせた。ようやく高紳県令が現れた。太って笑みを浮かべ、後ろで息子があくびをしている。</p><p>「かどわかし？なんと醜い言葉だ。息子はお前の家族を客として招いただけだ。」県令はひげをなでる。「だが、お前は腕のいい鍛冶屋だそうだな。我が家の武器庫に一人ほしい。仕えるなら家族は大切な客として扱おう。断るなら、役人を誹謗した罪で竹の杖二十打だ。」</p>`,
      c1: { _: "受け入れる。高家に仕える", d: "高家の武器庫で鍛冶をする。家族の近くにいられるが、高家の思うままだ。" },
      c2: { _: "断って杖打ちを受ける", d: "二十打。次の巡は傷ついた背中で鍛冶をする。武器ごとに 2 打少ない。", note: "二十打。這って家に帰った。王婆さんは黙って背中の傷を洗ってくれた。" } },
    night: { eb: "真夜中" },
    raidWin: { title: "塀を越えて",
      granny: "王婆さんが高家の馬小屋の屋根に火をつけ、誰よりも大声で騒ぎ立てた。",
      lockEasy: "屋敷の者が桶を取りに走る隙に、裏の塀を越えた。{blade}は奥の間の錠を紙のように断ち切った。",
      lockHard: "屋敷の者が桶を取りに走る隙に、裏の塀を越えた。{blade}で奥の間の錠を壊すのに三度かかった。",
      text: "{who}が待っていた。{B}を背負い、葦の沼の端まで走り続けた。夜明けにはあなたの首に賞金がかかり、鉄牛という好漢の頭領が炉を用意してくれていた。" },
    raidLose: { title: "捕らわれて",
      useless: "犬が一匹吠えた。それから十匹。中庭いっぱいの家来の前で、{blade}は役に立たなかった。動けなくなるまで打ちのめされた。",
      notEnough: "犬が一匹吠えた。それから十匹。中庭いっぱいの家来の前では、{blade}では足りなかった。動けなくなるまで打ちのめされた。",
      text: "目を覚ますと、鎖につながれて高県令の前にいた。「塀を登る鍛冶屋か」と県令は考え込む。「よかろう。我が家のために鍛冶をせよ。家族は引き続き客として預かる。おとなしくしておれ。」",
      c1: "高家の武器庫で働く" },
    general: { eb: "蒙将軍の陣営" },
    genYes: { title: "将軍、出陣す",
      text: `<p>蒙将軍はあなたの名を知っていた。趙伍長からの帳簿を持っている。達成したノルマ、関で持ちこたえた刃。</p><p>「我らが国のために血を流す間に、県令のせがれが我が一番の鍛冶屋の家族をさらったと？」将軍はその日の午後、二十騎を柳湾村へ送った。高英は広場に引きずり出され、県じゅうの前で鞭打たれた。{who}は自由の身で家に帰った。</p><p>一週間後、王の印のある書状が届いた。あなたは都の王立武器廠に召し出される。</p>`,
      c1: "家族と都へ行く" },
    genNo: { title: "将軍は断った",
      text: `<p>陣営の門の前で二日待った。ようやく会ってくれた将軍は、帳簿に目をやった。「功績 {m}。お前のような鍛冶屋は千人いる。関には秦が迫っている。家族の揉め事に騎兵は割けん。」</p><p class="muted">功績が {merit} 必要だった。ノルマを余裕をもって達成すれば、次はもっと稼げる。</p>`,
      c1: "馬で家に帰る", note: "将軍は助けてくれなかった。" },
    drum: { eb: "都", title: "登聞鼓",
      text: `<p>都まで四日かかった。大きな鼓が宮門の外に立ち、その皮は絶望した人々の手で黒ずんでいる。御史が出てきて一言残らず書き留めるまで、あなたは鼓を打ち続けた。</p><p>「朝廷が調べる」と御史は言った。「時間がかかるかもしれぬ。務めに戻り、祈るがよい。」</p>`,
      c1: { _: "軍に戻って待つ", d: "次の休暇までに訴えが裁かれる。功績があれば朝廷は耳を傾ける。" } },
    drumWin: { title: "御史の裁き",
      text: "帰ってみると村は大騒ぎだった。王の御史が来て、去っていった。高県令は職を解かれ、高英は逃げた。{who}は家にいる。やせて青白いが、家にいる。",
      c1: "家族を抱きしめる" },
    drumLose: { title: "返事はない",
      text: "御史は来なかった。王婆さんによれば、高家が朝廷に荷車一台分の贈り物を送ったという。{who}はまだ高家の屋敷にいる。",
      c1: "ならば自分で動く", note: "朝廷は助けてくれない。" },
    marsh: { eb: "葦の沼 · 襲撃の合間", title: "朝廷からの知らせ",
      text: `<p>家族は今、高床の小屋に住んでいる。{W}は網の繕い方を覚え、{B}はあなたより上手に舟を操る。</p><p>舟が知らせを運んできた。朝廷は兵が足りず、戦に加わる好漢には恩赦を与えるという。そして鉄牛には鉄牛の考えがある。「高家の屋敷は巻き上げた税でぱんぱんだ、兄弟。いい武器をくれりゃ、奪ってやる。」</p>`,
      c1: { _: "朝廷の恩赦を受ける", d: "罪は許され、軍の陣営に戻る。家族は柳湾村に帰る。" },
      c2: { _: "好漢たちと残る", d: "沼のために鍛冶を続ける。兄弟たちは仲間を見捨てない。" },
      c3: { _: "高家の屋敷への襲撃を率いる", d: "鉄牛のために +6 以上の刃を打つ。持ちこたえれば屋敷は落ち、戦利品は山分けだ。" } },
    gao: { eb: "高家の屋敷", title: "家族との一時",
      text: `<p>銭執事は、どの戸口にも見張りがいる中庭で、{who}と一時だけ会わせてくれた。食べ物も絹の衣もあるのに、まるで幽霊のようだ。王婆さんは{B}を屋敷の門まで連れてきて、手を振らせてくれている。</p><p>次の巡まで数日ある。</p>`,
      c1: { _: "高英に秘宝を打ち、家族の自由を願う", d: "+8 以上の刃を打つ。そんな剣のためなら、高英は何でも差し出すかもしれない。" },
      c2: { _: "王婆さんの助けで脱走を企てる", d: "王婆さんが鍵を持ち込み、皆で沼へ逃げる。信頼が厚いほど成功しやすい。" },
      c3: { _: "耐える。鍛冶を続けて家族を守る", d: "言われた通りにする。いつか、何かが変わるかもしれない。" } },
    escWin: { title: "台所の戸", text: "王婆さんがかぶの籠を持ってやって来た。鍵は饅頭の中に焼き込んである。三更、{who}を連れて台所の戸から抜け出し、{B}を拾って、夜通し歩いて葦の沼へ。鉄牛は高家の屋敷から逃げた鍛冶屋の噂を聞いていた。「鍛冶はできるか？」" },
    escLose: { title: "犬に裏切られて", text: "鍵は合った。犬には関係なかった。家来たちに武器庫へ引き戻され、銭執事に打ちすえられた。家族は奥の間に移され、もう会えない。", c1: "金床へ戻る" },
    royal: { eb: "都", title: "自分の中庭",
      text: `<p>武器廠は東市の近くに小さな中庭付きの家をくれた。{W}は菊を植えた。{D}には数え切れないほどの求婚者がいるが、王家の鍛冶の娘に無礼を働く者はいない。</p><p>龔大臣から知らせがあった。戦が終わったら、王は勝利を記念する剣を望んでいる。それをあなたに打たせたいという。その前に数日の休息がある。</p>`,
      c1: { _: "家族と過ごす", d: "次の巡は炉の霊が半分満ちた状態で始まる。" },
      c2: { _: "{B}を弟子として武器廠に連れていく", d: "小さな名工のようにふいごを作り直してくれる。これから炉の適温の帯が広くなる。" },
      c3: { _: "古の鍛冶の書を学ぶ", d: "欧冶子の槌さばきの秘訣を会得する。タイミングバーの明るい帯が永久に広くなる。" } },
    ransom: { title: "公正な取引",
      text: `<p>高英が刃を抜くと、広間は静まり返った。振ってみて子どものように笑い、何でも承知した。{who}はあなたと並んで高家の屋敷を出た。</p><p>契約は軍が買い取り、あなたは自由の身で補給陣営に戻る。家では家族が待っている。</p>`,
      c1: "軍に戻る" },
    marshAfter: { win: "屋敷が燃える", lose: "ひどい夜", text: "沼はこれまで以上に鍛冶屋を必要としている。" },
  },
  c: { joinMarsh: "沼の好漢に加わる", bruised: "ひどい打撲：次の巡は武器ごとに 2 打少ない。", backToForge: "炉へ戻る" },

  blade: { plus: "+{g} の刃", broken: "砕けた刃" },
  ch: {
    eb: "特別な依頼", hint: "熱するのは一度、熱が続く限り打てる。満足したら焼き入れしよう。", go: "炉に火を入れる", say: "あなたと槌と鋼だけだ。",
    gift: { title: "高英への贈り物", text: "甘やかされた若様が{D}のことを忘れるほど見事な剣を打て。<b>+5 以上</b>が必要だ。",
      win: "高英は +{g} の剣を陽にかざし、ほかのことはすべて忘れた。「娘はくれてやる」と笑う。「こっちのほうがずっと美しい。」",
      broke: "刃は砕けた。仲人の劉は帰っていき、あなたが高家を侮辱したと言いふらした。",

    raid: { title: "夜の刃", text: "高家の屋敷へ押し入るための刀を打て。等級が上がるほど、{who}を救い出せる見込みが上がる。砕けた刃ではほとんど望みはない。" },
    ransom: { title: "鋼の身代金", text: "高英のために秘宝の剣を打て。<b>+8 以上</b>に届けば、それと引き換えに家族の自由を願い出る。",
      broke: "刃は砕けた。銭執事は家族の米を減らした。", lose: "高英は +{g} の刃を鼻で笑い、それでも受け取った。何も変わらない。" },
    revenge: { title: "鉄牛への鋼", text: "高家の屋敷を襲うため、鉄牛に斬馬刀を打て。勝つには <b>+6 以上</b>が必要だ。",
      win: "高家の屋敷が燃え上がる。好漢たちは巻き上げられた税の箱を運び出し、鉄牛はあなたに 400 文の分け前を渡した。",

    king: { title: "王の剣", text: "戦は終わり、梁王は勝利にふさわしい剣を望んでいる。<b>+10 以上</b>に達して伝説を打ち上げよ。" },

  end: {
    eb: "エンディング {n}/{total}",
    home: { title: "誉れある帰郷",
      text: "<p>黄河のほとりで和議が結ばれた。軍は鍛冶屋たちを解き放ち、あなたは銀の袋と蒙将軍の感状を手に、柳の門をくぐって家に帰る。</p><p>{W}が待っている。",
      married: "{D}と阿水の婚礼は、柳湾村で何年ぶりかの宴となり、王婆さんは夜明けまで踊った。",

      son: "{B}が槌の使い方を教えてとせがみ、あなたは教えてやる。" },
    bitter: { title: "苦い銀", text: "<p>戦が終わり、重い財布を持って帰った。{D}はいない。ときどき赤い輿が県の道を通ると、あなたは目をそらす。</p><p>{W}は結納金を寝台の下の甕にしまっている。二人とも、決して手をつけない。</p>" },
    empty: { title: "空っぽの家",
      text: `<p>戦は終わったが、高家の屋敷の門は閉ざされたままだ。{who}は二度と帰ってこなかった。あなたは柳湾村の炉を燃やし続け、{B}は高家へ続く道を見つめながら、無口に育った。</p><p class="muted">金床では勝てない物語もある。家での選択を変えてみよう。</p>` },
    outlaw: { title: "葦の沼の好漢",
      revenge: "高家の屋敷は灰となり、巻き上げられた税は村々に返された。",
      text: "戦はあなた抜きで終わった。葦の沼の好漢たちはあなたを「鉄の手」と呼ぶ。あなたが打つ刃にはどれも小さな刻みがあり、兄弟たちはそれであなたの作と分かる。",
      with: "{who}と{B}は葦の中であなたと暮らしている。貧しく、追われる身だが、共にいる。",
      alone: "あなたは葦の中で暮らし、できるときに家へ銀を送る。" },
    cage: { title: "金の鳥籠", text: `<p>高家は鍛冶屋を手放さなかった。あなたの刃は県令の護衛を武装させ、高英の壁を飾る。家族に会えるのは祭りの日、中庭の向こう側から。</p><p>食べ物もあり、暖かく、そして決して自由ではない。</p><p class="muted">ほかにも道はあった。次はもっと大胆な選択を。</p>` },
    royal: { title: "王家の鍛冶",

    leave: { eb: "Permiso en casa" },
    levy: { title: "El impuesto de guerra",
      text: `<p>Cascos en el callejón. Gao Ying, el hijo del magistrado del condado, llega a caballo con cuatro guardias. Tiene veinte años, manos blandas y lleva más seda que toda la aldea junta.</p><p>"Un impuesto de guerra", anuncia su mayordomo. "Sesenta wen por casa, para la defensa del reino." Todos saben que el dinero nunca sale de la mansión Gao.</p>`,
      c1: { _: "Pagar el impuesto", d: "Mejor una bolsa más ligera que su atención.", note: "Gao Ying apenas te mira. Bien." },
      c2: { _: "Negarte. Ya sirves al ejército", d: "Cierto, y valiente. Recordará tu cara.", note: "La mirada de Gao Ying se posa un buen rato en tu casa antes de seguir su camino." } },
    mm: { title: "La casamentera",
      text: `<p>La casamentera Liu llega en una silla de manos roja con una caja lacada. "¡Qué fortuna! El joven amo Gao vio a {D} en el mercado y no deja de pensar en ella. Ofrece llevarla a su casa como su séptima concubina."</p><p>Abre la caja: <b>300 wen</b> en monedas ensartadas. "¡Una dote! ¡En año de guerra!"</p>`,
      c1: { _: "Aceptar la dote", d: "{D} se va a la mansión Gao. Recibes 300 wen y el favor de los Gao.", note: "{D} no mira atrás desde la silla de manos. {W} no te habla en todo el día." },
      c2: { _: "Rechazar con cortesía", d: "Reverencia, halagos y un no. Los Gao no están acostumbrados a oír un no.", note: "La casamentera Liu se marcha sonriendo, lo cual es peor que si hubiera gritado." },
      c3: { _: "Prometer a {D} con Ah Shui, el vecino", d: "A una chica prometida no se la puede tomar como concubina sin escándalo. El nieto de la abuela Wang la adora desde hace años.", req: "Necesitas la confianza de la abuela Wang, o 100 wen para un regalo de compromiso decente.", note: "El compromiso es apresurado y los Gao se sienten insultados, pero {D} ya tiene prometido." },
      c4: { _: "Ofrecer a Gao Ying una espada fina a cambio", d: "Forja esta noche una hoja de +5 o más. A los jóvenes como él les gusta más una espada hermosa que cualquier muchacha." } },
    market: { title: "Día de mercado",
      text: `<p>Llevas a la familia al mercado del condado. Junto a los puestos de pescado, Gao Ying sale de una casa de té y agarra a {T} por la muñeca. "Ven a servirme el té", se ríe. Sus guardias se ríen con él. De pronto la gente encuentra muy interesantes las coles.</p>`,
      c1: { _: "Inclinarte y pedir perdón", d: "Apártala con suavidad y discúlpate por nada. Esta vez la soltará.", note: "Gao Ying la suelta, pero le pregunta tu nombre a un guardia." },
      c2: { _: "Tirarlo a la tina de pescado", d: "Será maravilloso. Luego tendrás que huir, con toda tu familia." },
      c3: { _: "Mostrarle tu insignia del general Meng", d: "Un herrero con suficiente mérito lleva la protección del general.", req: "Necesitas {merit} de mérito. Tienes {m}. Cumple las cuotas con holgura para ganar más.", note: "Gao Ying palidece ante el sello del general y se escabulle a la casa de té. Nadie volverá a molestar a tu familia." },
      c4: { _: "Deslizarle plata a su mayordomo", d: "El dinero habla con los Gao.", note: "El mayordomo le susurra algo a su amo y Gao Ying pierde el interés. Por ahora." } },
    flee: { title: "Entre los juncos",
      text: `<p>Gao Ying cae de cabeza en la tina de pescado. Durante un glorioso instante todo el mercado guarda silencio. Luego los guardias desenvainan.</p><p>Agarras a {W}, {D} y {B} y corres. La abuela Wang os esconde en su bodega hasta que oscurece, y a medianoche un barquero que no hace preguntas os lleva al fondo del Pantano de Juncos, donde viven forajidos fuera del alcance de cualquier magistrado.</p><p>Un hombre enorme con la cara llena de cicatrices te recibe en el embarcadero. "Me han contado lo que le hiciste al chico Gao", dice Buey de Hierro. "¿Sabes forjar?"</p>` },
    abduct: { title: "Cascos en la noche",
      text: { _: "<p>En tu segunda noche en casa, los guardias de los Gao echan abajo tu puerta. Luchas, y un garrotazo en la cabeza te tumba. Cuando despiertas, {who} ya no está. {B} se esconde bajo la cama de la abuela Wang, en la casa de al lado.</p>",
        pl: "<p>En tu segunda noche en casa, los guardias de los Gao echan abajo tu puerta. Luchas, y un garrotazo en la cabeza te tumba. Cuando despiertas, {who} ya no están. {B} se esconde bajo la cama de la abuela Wang, en la casa de al lado.</p>" },
      c1: "Levantarte" },
    empty: { title: "La casa vacía", title2: "¿Y ahora qué?",
      text: `<p>La puerta cuelga de una sola bisagra. La tinaja de arroz está rota. Tu casa está en silencio.</p><p>La abuela Wang, la vecina, está sentada en tu escalón con {B} dormido en su regazo. "Vinieron hace tres días", susurra. "Los hombres del joven amo Gao. Se llevaron a {who}. El niño se escondió en la tinaja de arroz hasta que se fueron. No soportaba dejarlo solo, así que lo he estado cuidando."</p>`,
      ask: { _: "{who} está retenida en la mansión Gao. ¿Qué vas a hacer?", pl: "{who} están retenidas en la mansión Gao. ¿Qué vas a hacer?" },
      c1: { _: "Agradecérselo como es debido a la abuela Wang", d: "Dale plata por las molestias. Es pobre y se arriesgó.", note: "La abuela Wang llora y te llama buen hijo. Dice que te ayudará en lo que pueda." },
      c2: { _: "Presentar una petición en el yamen del condado", d: "Soborna al escribano para que el magistrado oiga tu caso. El magistrado es el padre de Gao Ying." },
      c3: { _: "Asaltar la mansión Gao esta noche", d: "Fórjate una hoja, salta el muro y recupéralas. Cuanto mejor la hoja, más posibilidades. La abuela Wang puede crear una distracción si confía en ti." },
      c4: { _: "Cabalgar al campamento del general Meng", d: "Suplica ayuda al general. Solo escucha a herreros con mérito (necesitas {merit})." },
      c5: { _: "Ir a la capital y tocar el Tambor de Agravios", d: "Cualquier súbdito puede tocar el tambor ante el palacio para pedir justicia al rey. La justicia es lenta, y debes volver al trabajo mientras esperas." } },
    yamen: { eb: "El yamen del condado", title: "El magistrado Gao",
      text: `<p>El escribano toma tu plata y te deja arrodillado en el patio medio día. Por fin aparece el magistrado Gao Shen, rollizo y sonriente, con su hijo bostezando detrás.</p><p>"¿Secuestro? Qué palabra tan fea. Mi hijo ha invitado a tu familia como huéspedes." Se acaricia la barba. "Pero me dicen que eres un buen herrero. La armería de mi casa necesita uno. Sírveme, y tu familia será tratada como huéspedes de honor. Niégate, y recibirás veinte varazos por calumniar a un funcionario."</p>`,
      c1: { _: "Aceptar. Servir a la casa Gao", d: "Forjarás en la armería de los Gao, cerca de tu familia, pero a merced de los Gao." },
      c2: { _: "Negarte y aguantar la paliza", d: "Veinte varazos. Forjarás con la espalda magullada el próximo turno: 2 golpes menos por arma.", note: "Veinte varazos. Vuelves a casa a rastras. La abuela Wang te cura la espalda sin decir palabra." } },
    night: { eb: "Medianoche" },
    raidWin: { title: "Sobre el muro",
      granny: "La abuela Wang prende fuego al tejado del establo de los Gao y luego se lamenta más fuerte que nadie.",
      lockEasy: "Saltas el muro trasero mientras la casa corre a por cubos. Tu {blade} corta el candado de las estancias de las mujeres como si fuera papel.",
      lockHard: "Saltas el muro trasero mientras la casa corre a por cubos. Tu {blade} necesita tres golpes para romper el candado de las estancias de las mujeres.",
      text: { _: "{who} te espera. Corres, con {B} a la espalda, hasta el borde del Pantano de Juncos. Al amanecer ponen precio a tu cabeza, y un jefe forajido llamado Buey de Hierro te ofrece una forja.",
        pl: "{who} te esperan. Corres, con {B} a la espalda, hasta el borde del Pantano de Juncos. Al amanecer ponen precio a tu cabeza, y un jefe forajido llamado Buey de Hierro te ofrece una forja." } },
    raidLose: { title: "Atrapado",
      useless: "Un perro ladra. Luego diez. Tu {blade} no sirve de nada contra un patio lleno de guardias. Te golpean hasta que dejas de moverte.",
      notEnough: "Un perro ladra. Luego diez. Tu {blade} no basta contra un patio lleno de guardias. Te golpean hasta que dejas de moverte.",
      text: 'Cuando despiertas, estás encadenado ante el magistrado Gao. "Un herrero que escala muros", reflexiona. "Muy bien. Forjarás para mi casa. Tu familia sigue siendo mi huésped, así que pórtate bien."',
      c1: "Trabajar en la armería de los Gao" },
    general: { eb: "El campamento del general Meng" },
    genYes: { title: "El general cabalga",
      text: { _: `<p>El general Meng conoce tu nombre. Tiene tu libro de cuentas del sargento Zhao: las cuotas cumplidas, las hojas que aguantaron en el paso.</p><p>"¿El hijo de un magistrado roba la familia de mi mejor herrero mientras sangramos por el reino?" Esa misma tarde envía veinte jinetes a Recodo del Sauce. Arrastran a Gao Ying a la plaza y lo azotan ante todo el condado, y {who} vuelve a casa libre.</p><p>Una semana después llega una carta con el sello real: te convocan al Arsenal Real de la capital.</p>`,
        pl: `<p>El general Meng conoce tu nombre. Tiene tu libro de cuentas del sargento Zhao: las cuotas cumplidas, las hojas que aguantaron en el paso.</p><p>"¿El hijo de un magistrado roba la familia de mi mejor herrero mientras sangramos por el reino?" Esa misma tarde envía veinte jinetes a Recodo del Sauce. Arrastran a Gao Ying a la plaza y lo azotan ante todo el condado, y {who} vuelven a casa libres.</p><p>Una semana después llega una carta con el sello real: te convocan al Arsenal Real de la capital.</p>` },
      c1: "Ir a la capital con tu familia" },
    genNo: { title: "El general se niega",
      text: `<p>Esperas dos días ante la puerta del campamento. Cuando el general por fin te recibe, echa un vistazo a tu libro. "{m} de mérito. Tengo mil herreros como tú, y a Qin en el paso. No puedo prestar caballería para una riña familiar."</p><p class="muted">Necesitabas {merit} de mérito. Cumple las cuotas con holgura para ganar más la próxima vez.</p>`,
      c1: "Volver a casa", note: "El general no quiso ayudar." },
    drum: { eb: "La capital", title: "El Tambor de Agravios",
      text: `<p>Tardas cuatro días en llegar a la capital. El gran tambor se alza ante la puerta del palacio, con el parche oscurecido por las manos de los desesperados. Lo golpeas hasta que sale un censor y anota cada palabra.</p><p>"La corte investigará", dice. "Puede tardar. Vuelve a tu deber y reza."</p>`,
      c1: { _: "Volver al ejército y esperar", d: "Tu petición se juzgará antes de tu próximo permiso. El mérito hace que la corte escuche." } },
    drumWin: { title: "El veredicto del censor",
      text: { _: "Al volver encuentras la aldea alborotada. El censor real ha venido y se ha ido. Han destituido al magistrado Gao y Gao Ying ha huido. {who} está en casa, delgada y pálida, pero en casa.",
        pl: "Al volver encuentras la aldea alborotada. El censor real ha venido y se ha ido. Han destituido al magistrado Gao y Gao Ying ha huido. {who} están en casa, delgadas y pálidas, pero en casa." },
      c1: "Abrazar a tu familia" },
    drumLose: { title: "Sin respuesta",
      text: { _: "Ningún censor llegó. La abuela Wang te cuenta que los Gao enviaron a la corte un carro lleno de regalos. {who} sigue en la mansión Gao.",
        pl: "Ningún censor llegó. La abuela Wang te cuenta que los Gao enviaron a la corte un carro lleno de regalos. {who} siguen en la mansión Gao." },
      c1: "Entonces actuarás tú", note: "La corte no ayudará." },
    marsh: { eb: "El Pantano de Juncos · entre asaltos", title: "Noticias de la corte",
      text: `<p>Tu familia tiene ahora una choza sobre pilotes. {W} ha aprendido a remendar redes y {B} maneja la pértiga de una barca mejor que tú.</p><p>Una barca trae noticias: la corte necesita soldados con desesperación y ofrece amnistía a todo forajido que se una a la guerra. Y Buey de Hierro tiene un plan propio. "La mansión Gao rebosa de impuestos robados, hermano. Ármanos bien y la tomamos."</p>`,
      c1: { _: "Aceptar la amnistía de la corte", d: "Te perdonan tus crímenes y vuelves al campamento del ejército. Tu familia regresa a Recodo del Sauce." },
      c2: { _: "Quedarte con los forajidos", d: "Sigue forjando para el pantano. Los hermanos cuidan de los suyos." },
      c3: { _: "Encabezar el asalto a la mansión Gao", d: "Forja una hoja de +6 o más para Buey de Hierro. Si aguanta, la mansión cae y el botín se reparte." } },
    gao: { eb: "La mansión Gao", title: "Una hora con tu familia",
      text: `<p>El mayordomo Qian te deja ver a {who} durante una hora, en un patio con guardias en cada puerta. Están alimentadas y vestidas de seda, y parecen fantasmas. La abuela Wang lleva a {B} a la puerta de la mansión para que pueda saludar con la mano.</p><p>Tienes unos días antes del próximo turno.</p>`,
      c1: { _: "Forjar un tesoro para Gao Ying y pedir su libertad", d: "Haz una hoja de +8 o más. Gao Ying podría cambiar cualquier cosa por una espada así." },
      c2: { _: "Planear una fuga con ayuda de la abuela Wang", d: "La abuela Wang mete una llave a escondidas y todos huís al pantano. Cuanto más confíe en ti, mejores las probabilidades." },
      c3: { _: "Aguantar. Seguir forjando y mantenerlas a salvo", d: "Haz lo que te dicen. Algún día, quizá, las cosas cambien." } },
    escWin: { title: "La puerta de la cocina", text: 'La abuela Wang llega con una cesta de nabos y una llave horneada dentro de un bollo. En la tercera guardia sacas a {who} por la puerta de la cocina, recoges a {B} y caminas toda la noche hasta el Pantano de Juncos. Buey de Hierro ha oído hablar del herrero que escapó de la mansión Gao. "¿Sabes forjar?", pregunta.' },
    escLose: { title: "Traicionado por un perro", text: "La llave funciona. Al perro le da igual. Los guardias te arrastran de vuelta a la armería y el mayordomo Qian ordena que te golpeen. Trasladan a tu familia a las estancias interiores, donde no puedes verla.", c1: "De vuelta al yunque" },
    royal: { eb: "La capital", title: "Un patio propio",
      text: `<p>El Arsenal te da una casita con patio cerca del Mercado del Este. {W} ha plantado crisantemos. {D} tiene más pretendientes de los que puedes contar, y ninguno se atreve a faltarle al respeto a la hija de un herrero real.</p><p>El ministro Gong trae noticias: cuando termine la guerra, el rey quiere una espada que celebre la victoria. Y la quiere de ti. Antes tienes unos días de descanso.</p>`,
      c1: { _: "Pasar los días con tu familia", d: "El espíritu de la forja empieza a medias el próximo turno." },
      c2: { _: "Llevar a {B} al Arsenal como aprendiz", d: "Reconstruye tu fuelle como un pequeño maestro: desde ahora la franja buena de la forja es más ancha." },
      c3: { _: "Estudiar los antiguos manuales de forja", d: "Aprendes el secreto del martillazo de Ou Yezi: la franja brillante de la barra de ritmo es más ancha para siempre." } },
    ransom: { title: "Un trato justo",
      text: `<p>Gao Ying desenvaina la hoja y toda la sala enmudece. La blande, se ríe como un niño y acepta cualquier cosa. {who} salen de la mansión Gao a tu lado.</p><p>El ejército compra tu contrato y vuelves al campamento de suministros como hombre libre, con una familia esperándote en casa.</p>`,
      c1: "Volver al ejército" },
    marshAfter: { win: "La mansión arde", lose: "Una mala noche", text: "El pantano necesita a su herrero más que nunca." },
  },
  c: { joinMarsh: "Unirte a los forajidos del pantano", bruised: "Muy magullado: 2 golpes menos por arma el próximo turno.", backToForge: "De vuelta a la forja" },
  chance: "Tu probabilidad era del {p}%.",
  blade: { plus: "hoja +{g}", broken: "hoja rota" },
  ch: {
    eb: "Un encargo especial", hint: "Un solo calentamiento, tantos golpes como permita el calor. Templa cuando estés satisfecho.", go: "Encender la forja", say: "Solo tú, el martillo y el acero.",
    gift: { title: "Un regalo para Gao Ying", text: "Forja un jian tan bello que un joven amo consentido se olvide de {D}. Necesitas <b>+5 o más</b>.",
      win: 'Gao Ying gira el jian +{g} a la luz del sol y se olvida de todo lo demás. "Quédate con tu hija", se ríe. "Esto es mucho más bonito."',
      broke: "La hoja se rompió. La casamentera Liu se marcha y cuenta a todos que insultaste a los Gao.",
      lose: "¿Una hoja +{g}? Gao Ying la tira a la zanja. Los Gao se sienten insultados." },
    raid: { title: "Una hoja para la noche", text: "Fórjate un dao para el asalto a la mansión Gao. Cada grado mejora tus posibilidades de sacar a {who}. Una hoja rota te deja casi sin opciones." },
    ransom: { title: "Un rescate de acero", text: "Forja un jian preciado para Gao Ying. Si llega a <b>+8 o más</b>, pedirás a cambio la libertad de tu familia.",
      broke: "La hoja se rompió. El mayordomo Qian recorta el arroz de tu familia.", lose: "Gao Ying desprecia la hoja +{g} y se la queda de todos modos. Nada cambia." },
    revenge: { title: "Acero para Buey de Hierro", text: "Forja para Buey de Hierro un dao matacaballos para el asalto a la mansión Gao. Debe ser <b>+6 o más</b> para ganar el día.",
      win: "La mansión Gao arde. Los forajidos sacan cofres de impuestos robados y Buey de Hierro te entrega una parte de 400 wen.",
      broke: "La hoja se rompió en la primera puerta. El asalto se desmorona y dos hermanos no regresan.",
      lose: "El dao +{g} se dobla contra las cadenas del portón. Rechazan el asalto." },
    king: { title: "La espada del rey", text: "La guerra ha terminado y el rey de Liang quiere una espada digna de la victoria. Llega a <b>+10 o más</b> para forjar una leyenda." },
  },
  end: {
    eb: "Final {n} de {total}",
    home: { title: "En casa con honor",
      text: "<p>La paz se firma a orillas del río Amarillo. El ejército libera a sus herreros y vuelves a casa por la puerta del sauce con una bolsa de plata y una mención del general Meng.</p><p>{W} te espera.",
      married: "La boda de {D} con Ah Shui es el primer banquete que Recodo del Sauce celebra en años, y la abuela Wang baila hasta el amanecer.",
      hidden: "{D} vuelve de las colinas más alta y morena, y no para de hablar de cabras.",
      grown: "{D} se ha convertido en una mujer a la que apenas reconoces.",
      son: "{B} te pide que le enseñes el martillo, y lo haces." },
    bitter: { title: "Plata amarga", text: "<p>La guerra termina y vuelves a casa con la bolsa llena. {D} no está. A veces una silla de manos roja pasa por el camino del condado y apartas la mirada.</p><p>{W} guarda la dote en una tinaja bajo la cama. Ninguno de los dos la gasta jamás.</p>" },
    empty: { title: "La casa vacía",
      text: { _: `<p>La guerra termina, pero las puertas de la mansión Gao siguen cerradas. {who} nunca vuelve a casa. Mantienes encendida la forja de Recodo del Sauce, y {B} crece callado, vigilando el camino de los Gao.</p><p class="muted">Algunas historias no se ganan en el yunque. Prueba otra decisión en casa.</p>`,
        pl: `<p>La guerra termina, pero las puertas de la mansión Gao siguen cerradas. {who} nunca vuelven a casa. Mantienes encendida la forja de Recodo del Sauce, y {B} crece callado, vigilando el camino de los Gao.</p><p class="muted">Algunas historias no se ganan en el yunque. Prueba otra decisión en casa.</p>` } },
    outlaw: { title: "Forajidos del Pantano de Juncos",
      revenge: "La mansión Gao es ceniza, y los impuestos robados se devolvieron a las aldeas.",
      text: "La guerra termina sin ti. En el Pantano de Juncos, los forajidos te llaman Mano de Hierro, y cada hoja que forjas lleva una pequeña muesca para que los hermanos sepan que es tuya.",
      with: "{who} y {B} viven contigo entre los juncos: pobres, perseguidos y juntos.",
      alone: "Vives entre los juncos y mandas plata a casa cuando puedes." },
    cage: { title: "La jaula dorada", text: `<p>La casa Gao se queda con su herrero. Tus hojas arman a la guardia del magistrado y decoran las paredes de Gao Ying. Ves a tu familia en los días de fiesta, al otro lado de un patio.</p><p>Comes, tienes calor y nunca eres libre.</p><p class="muted">Había otras salidas. Prueba una decisión más audaz la próxima vez.</p>` },
    royal: { title: "Herrero real",
      text: `<p>El rey acepta con gentileza tu {blade}, y te nombran Herrero del Arsenal Real. Tu familia vive en la capital con sus propios criados.</p><p>Es una buena vida. Pero oíste lo que forjaban los viejos maestros y sabes que podrías haber hecho más.</p><p class="muted">Forja la espada del rey a +10 o más para el mejor final.</p>`,
      second: "segundo intento", sword: "espada +{g}" },
    heaven: { title: "Herrero Bajo el Cielo", text: `<p>El rey de Liang desenvaina tu espada +{g} en el gran salón, y la luz corre por ella como el agua. La bautiza con el nombre de la victoria y hace grabar tu nombre junto al suyo en la vaina.</p><p>Te llaman el Herrero Bajo el Cielo. {W}, {D} y {B} miran desde la galería, y {B} dice que él también será herrero.</p>` },
    front: { title: "Enviado al frente", hint: "Demasiadas cuotas fallidas. Templa antes, usa tu cofre y gasta plata con Fang para ir por delante." },
    days: "Días en el yunque", merit: "Mérito ganado", silver: "Plata restante", diff: "Dificultad", again: "Jugar de nuevo con la misma familia", new: "Empezar con una familia nueva",
  },
  trouble: { 1: "Una vida tranquila.", 3: "Habladurías y casamenteras.", 4: "Peligro: atenciones no deseadas.", 5: "Desastre en tu primer permiso." },
  setup: {
    say: "Elige a tu herrero y a tu familia.",
    intro: "Los reinos están en guerra y se han llevado a todos los hombres al ejército. A todos menos a ti, el herrero. Forja armas para la guerra, gánate el permiso y protege a tu familia cuando vuelvas a casa.",
    continue: "Continuar tu historia guardada", name: "Tu nombre", diff: "Dificultad", wife: "Tu esposa", dau: "Tu hija, 16 años", son: "Tu hijo pequeño, 6 años", beauty: "Atractivo",
    beautyHelp: "Atractivo: {list}. El hijo del magistrado del condado tiene la mirada inquieta. Cuanto más bella sea tu familia, antes y con más fuerza la encontrarán los problemas.",
    meritNeed: "Mérito necesario para la ayuda del general: {m}.", begin: "Empezar la historia",
  },
});

IUH_LANG("fr", {

      text: `<p>Les sept royaumes sont en guerre, et l'État de Liang est en train de perdre. Ce printemps, les recruteurs sont venus à Saule-Courbe et ont pris tous les hommes capables de tenir une lance : les paysans, les pêcheurs, et même le garçon qui vendait des raviolis près du pont.</p>

      text: `<p>Tu emmènes la famille au marché du district. Près des étals de poisson, Gao Ying sort d'une maison de thé et attrape {T} par le poignet. « Viens me servir le thé », rit-il. Ses gardes rient avec lui. La foule trouve soudain les choux passionnants.</p>`,
      c1: { _: "S'incliner bas et demander pardon", d: "L'écarter doucement et s'excuser pour rien. Il la lâchera, cette fois.", note: "Gao Ying la lâche, mais il demande ton nom à un garde." },
      c2: { _: "Le pousser dans le bac à poissons", d: "Ce sera merveilleux. Ensuite il faudra fuir, avec toute ta famille." },
      c3: { _: "Lui montrer ton insigne du général Meng", d: "Un forgeron assez méritant porte la protection du général.", req: "Il faut {merit} de mérite. Tu en as {m}. Dépasse largement les quotas pour en gagner plus.", note: "Gao Ying pâlit devant le sceau du général et se faufile dans la maison de thé. Ta famille ne sera plus inquiétée." },
      c4: { _: "Glisser de l'argent à son intendant", d: "L'argent parle aux Gao.", note: "L'intendant chuchote à son maître, et Gao Ying perd tout intérêt. Pour l'instant." } },
    flee: { title: "Dans les roseaux",
      text: `<p>Gao Ying plonge tête la première dans le bac à poissons. Pendant un instant glorieux, tout le marché se tait. Puis les gardes tirent l'épée.</p><p>Tu attrapes {W}, {D} et {B} et tu cours. Grand-mère Wang vous cache dans sa cave jusqu'à la nuit, et à minuit un passeur qui ne pose pas de questions vous emmène au fond du Marais aux Roseaux, où vivent des hors-la-loi hors de portée de tout magistrat.</p><p>Un colosse au visage balafré t'accueille sur la jetée. « J'ai appris ce que tu as fait au fils Gao, dit Bœuf de Fer. Tu sais forger ? »</p>` },
    abduct: { title: "Des sabots dans la nuit",
      text: { _: "<p>Ta deuxième nuit à la maison, les gardes des Gao enfoncent ta porte. Tu te bats, et un coup de gourdin sur la tête t'envoie au sol. À ton réveil, {who} a disparu. {B} se cache sous le lit de grand-mère Wang, à côté.</p>",
        pl: "<p>Ta deuxième nuit à la maison, les gardes des Gao enfoncent ta porte. Tu te bats, et un coup de gourdin sur la tête t'envoie au sol. À ton réveil, {who} ont disparu. {B} se cache sous le lit de grand-mère Wang, à côté.</p>" },
      c1: "Se relever" },
    empty: { title: "La maison vide", title2: "Et maintenant ?",
      text: `<p>Le portail pend à un seul gond. La jarre de riz est brisée. Ta maison est silencieuse.</p><p>Grand-mère Wang, la voisine, est assise sur ton seuil avec {B} endormi sur ses genoux. « Ils sont venus il y a trois jours, murmure-t-elle. Les hommes du jeune maître Gao. Ils ont pris {who}. Le petit s'est caché dans la jarre de riz jusqu'à leur départ. Je ne pouvais pas le laisser seul, alors je m'occupe de lui. »</p>`,

      c1: { _: "Remercier dignement grand-mère Wang", d: "Donne-lui de l'argent pour sa peine. Elle est pauvre, et elle a pris un risque.", note: "Grand-mère Wang pleure et t'appelle son bon fils. Elle dit qu'elle t'aidera comme elle pourra." },
      c2: { _: "Porter plainte au yamen du district", d: "Soudoie le greffier pour que le magistrat entende ta cause. Le magistrat est le père de Gao Ying." },
      c3: { _: "Prendre d'assaut le manoir Gao ce soir", d: "Forge-toi une lame, escalade le mur et ramène-les. Meilleure la lame, meilleures tes chances. Grand-mère Wang peut créer une diversion si elle te fait confiance." },
      c4: { _: "Chevaucher jusqu'au camp du général Meng", d: "Supplie le général de t'aider. Il n'écoute que les forgerons méritants (il faut {merit})." },

    yamen: { eb: "Le yamen du district", title: "Le magistrat Gao",
      text: `<p>Le greffier prend ton argent et te laisse à genoux dans la cour une demi-journée. Enfin paraît le magistrat Gao Shen, dodu et souriant, son fils bâillant derrière lui.</p><p>« Un enlèvement ? Quel vilain mot. Mon fils a invité ta famille comme hôtes. » Il se caresse la barbe. « Mais on me dit que tu es un bon forgeron. L'armurerie de ma maison en a besoin d'un. Sers-moi, et ta famille sera traitée en hôtes d'honneur. Refuse, et tu recevras vingt coups de bambou pour avoir calomnié un fonctionnaire. »</p>`,

    general: { eb: "Le camp du général Meng" },
    genYes: { title: "Le général chevauche",
      text: { _: `<p>Le général Meng connaît ton nom. Il a ton registre du sergent Zhao : les quotas atteints, les lames qui ont tenu au col.</p><p>« Le fils d'un magistrat vole la famille de mon meilleur forgeron pendant que nous saignons pour le royaume ? » Il envoie vingt cavaliers à Saule-Courbe l'après-midi même. Gao Ying est traîné sur la place et fouetté devant tout le district, et {who} rentre libre à la maison.</p><p>Une semaine plus tard arrive une lettre au sceau royal : tu es convoqué à l'Arsenal royal de la capitale.</p>`,
        pl: `<p>Le général Meng connaît ton nom. Il a ton registre du sergent Zhao : les quotas atteints, les lames qui ont tenu au col.</p><p>« Le fils d'un magistrat vole la famille de mon meilleur forgeron pendant que nous saignons pour le royaume ? » Il envoie vingt cavaliers à Saule-Courbe l'après-midi même. Gao Ying est traîné sur la place et fouetté devant tout le district, et {who} rentrent libres à la maison.</p><p>Une semaine plus tard arrive une lettre au sceau royal : tu es convoqué à l'Arsenal royal de la capitale.</p>` },
      c1: "Partir pour la capitale avec ta famille" },
    genNo: { title: "Le général refuse",

    drum: { eb: "La capitale", title: "Le Tambour des Doléances",
      text: `<p>Il faut quatre jours pour atteindre la capitale. Le grand tambour se dresse devant la porte du palais, sa peau noircie par les mains des désespérés. Tu le bats jusqu'à ce qu'un censeur sorte et note chaque mot.</p><p>« La cour enquêtera, dit-il. Cela peut prendre du temps. Retourne à ton devoir, et prie. »</p>`,
      c1: { _: "Retourner à l'armée et attendre", d: "Ta requête sera jugée d'ici ta prochaine permission. Le mérite fait écouter la cour." } },

      c1: "Serrer ta famille dans tes bras" },
    drumLose: { title: "Pas de réponse",

        pl: "Aucun censeur n'est venu. Grand-mère Wang te raconte que les Gao ont envoyé à la cour une charrette de cadeaux. {who} sont toujours au manoir Gao." },

    marsh: { eb: "Le Marais aux Roseaux · entre deux raids", title: "Nouvelles de la cour",
      text: `<p>Ta famille a maintenant une hutte sur pilotis. {W} a appris à raccommoder les filets, et {B} mène une barque à la perche mieux que toi.</p><p>Une barque apporte des nouvelles : la cour manque cruellement de soldats et offre l'amnistie à tout hors-la-loi qui rejoint la guerre. Et Bœuf de Fer a son propre plan. « Le manoir Gao regorge d'impôts volés, frère. Arme-nous bien, et on le prend. »</p>`,

    gao: { eb: "Le manoir Gao", title: "Une heure avec ta famille",
      text: `<p>L'intendant Qian te laisse voir {who} pendant une heure, dans une cour gardée à chaque porte. Elles sont nourries et vêtues de soie, et elles ressemblent à des fantômes. Grand-mère Wang amène {B} à la porte du manoir pour qu'il puisse faire signe.</p><p>Tu as quelques jours avant la prochaine tournée.</p>`,

    escWin: { title: "La porte de la cuisine", text: "Grand-mère Wang arrive avec un panier de navets et une clé cuite dans un petit pain. À la troisième veille, tu fais sortir {who} par la porte de la cuisine, tu récupères {B} et vous marchez toute la nuit jusqu'au Marais aux Roseaux. Bœuf de Fer a entendu parler du forgeron qui s'est échappé du manoir Gao. « Tu sais forger ? » demande-t-il." },
    escLose: { title: "Trahi par un chien", text: "La clé fonctionne. Le chien s'en moque. Les gardes te traînent à l'armurerie, et l'intendant Qian te fait battre. Ta famille est déplacée dans les appartements intérieurs, où tu ne peux plus la voir.", c1: "Retour à l'enclume" },
    royal: { eb: "La capitale", title: "Une cour à toi",
      text: `<p>L'Arsenal te donne une petite maison à cour près du Marché de l'Est. {W} a planté des chrysanthèmes. {D} a plus de prétendants que tu ne peux en compter, et aucun n'ose manquer de respect à la fille d'un forgeron royal.</p><p>Le ministre Gong apporte une nouvelle : à la fin de la guerre, le roi veut une épée pour célébrer la victoire. Et il la veut de toi. D'abord, tu as quelques jours de repos.</p>`,
      c1: { _: "Passer ces jours en famille", d: "L'esprit du fourneau commence à moitié plein la prochaine tournée." },

    ransom: { title: "Un échange équitable",

    cage: { title: "La cage dorée", text: `<p>La maison Gao garde son forgeron. Tes lames arment la garde du magistrat et décorent les murs de Gao Ying. Tu vois ta famille les jours de fête, de l'autre côté d'une cour.</p><p>Tu es nourri, au chaud, et jamais libre.</p><p class="muted">Il y avait d'autres issues. Essaie un choix plus audacieux la prochaine fois.</p>` },

let last = performance.now(), hudT = 0;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  strikeCd = Math.max(0, strikeCd - dt);
  if (S && S.phase === "furnace" && $("fFill")) {
    const f = S.furnace, wide = S.relics.bellows || S.perks.bellows;
    if (f.holding && !f.done) f.g = Math.min(110, f.g + dt * (wide ? 26 : 34) * (1 + f.g / 90));
    else if (!f.done) f.g = Math.max(0, f.g - dt * 10);
    $("fFill").style.width = (f.g / 1.1) + "%";
  }
  if (S && S.phase === "anvil" && $("tMark") && curSword()) {
    const sp = .9 + .07 * curSword().grade;
    S.anvil.p += S.anvil.dir * sp * dt; if (S.anvil.p > 1) { S.anvil.p = 1; S.anvil.dir = -1; } if (S.anvil.p < 0) { S.anvil.p = 0; S.anvil.dir = 1; }
    $("tMark").style.left = (S.anvil.p * 100) + "%";
    hudT += dt; if (hudT > .1) { hudT = 0; updateAnvilPanel(); }
  }
  if (S) drawScene(dt); else { ctx.fillStyle = "#120d0a"; ctx.fillRect(0, 0, CW, CH); }
  requestAnimationFrame(frame);
}

resize();
applyStatic();
showSetup(!!loadSave());
requestAnimationFrame(frame);
})();

</script>

  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
